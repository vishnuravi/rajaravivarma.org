<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery, Raja Ravi Varma</title>
<link rel="stylesheet" href="styles.css?v=21">
<link rel="stylesheet" href="tweaks.css?v=21">
<style>
.gal-hero {
  padding-block: clamp(50px, 8vh, 100px) clamp(30px, 5vh, 60px);
  text-align: center;
}
.gal-hero h1 { font-style: italic; margin: 14px 0 22px; }
.gal-hero .lede { max-width: 640px; margin: 0 auto 22px; }
.gal-filters {
  display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
  margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--rule);
}
.gal-filter {
  font-family: var(--label);
  font-size: 0.72rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--rule);
  color: var(--ink-soft);
  cursor: pointer;
  transition: all .2s;
}
.gal-filter:hover { color: var(--oxblood); border-color: var(--gold); }
.gal-filter.on { background: var(--oxblood); color: var(--paper); border-color: var(--oxblood-deep); }

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: clamp(20px, 2.4vw, 36px);
  padding: 40px 0 80px;
}
.tile {
  cursor: zoom-in;
  position: relative;
  display: block;
  border: 0;
  background: transparent;
  text-align: left;
}
.tile .frame { transition: transform .35s ease; }
.tile:hover .frame { transform: translateY(-4px) rotate(-0.4deg); }
.tile .label {
  margin-top: 18px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 18px;
  border-top: 1px solid var(--rule);
  padding-top: 12px;
}
.tile .label .t {
  font-family: var(--display);
  font-style: italic;
  font-size: 1.25rem;
  color: var(--ink);
  line-height: 1.2;
}
.tile .label .y {
  font-family: var(--label);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--oxblood);
  white-space: nowrap;
}
.tile .blurb {
  font-size: 0.92rem;
  color: var(--ink-soft);
  margin-top: 8px;
}

/* Asymmetric grid sizing */
.tile.s { grid-column: span 4; }
.tile.m { grid-column: span 6; }
.tile.l { grid-column: span 8; }

@media (max-width: 1000px) {
  .tile.s { grid-column: span 6; }
  .tile.m { grid-column: span 6; }
  .tile.l { grid-column: span 12; }
}
@media (max-width: 600px) {
  .tile.s, .tile.m, .tile.l { grid-column: span 12; }
}

/* Lightbox */
.lb {
  position: fixed; inset: 0;
  background: rgba(10, 5, 4, 0.94);
  display: none;
  align-items: center; justify-content: center;
  z-index: 9000;
  padding: 40px;
}
.lb.show { display: flex; }
.lb-inner {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 40px;
  max-width: 1400px;
  width: 100%;
  max-height: 90vh;
}
.lb-img-wrap {
  position: relative;
  overflow: hidden;
  background: #1a0d0a;
  cursor: zoom-in;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold);
  box-shadow: 0 0 0 1px var(--oxblood-deep), 0 0 60px rgba(212, 165, 90, 0.2);
}
.lb-img-wrap.zoomed { cursor: zoom-out; }
.lb-img {
  max-width: 100%;
  max-height: 86vh;
  display: block;
  transition: transform .25s ease;
  transform-origin: center center;
}
.lb-img-wrap.zoomed .lb-img { max-width: none; max-height: none; transform: scale(2.2); }
.lb-side {
  display: flex; flex-direction: column; justify-content: center; gap: 18px;
  color: var(--paper);
}
.lb-side .eyebrow { color: var(--gold-bright); }
.lb-side h3 { font-family: var(--display); font-style: italic; font-size: 2.4rem; color: var(--paper); line-height: 1.1; }
.lb-side .meta-row { display: flex; gap: 22px; font-family: var(--label); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); flex-wrap: wrap; }
.lb-side p { color: rgba(243, 231, 208, 0.85); line-height: 1.6; }
.lb-side .hint {
  font-family: var(--label);
  font-size: 0.7rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-top: 14px;
  opacity: 0.7;
}
.lb-close {
  position: absolute; top: 20px; right: 20px;
  width: 44px; height: 44px;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--paper);
  cursor: pointer;
  font-size: 1.4rem;
  z-index: 10;
}
.lb-close:hover { background: var(--oxblood); }
.lb-nav {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  width: 50px; height: 80px;
  border: 1px solid var(--gold);
  background: rgba(20, 10, 8, 0.6);
  color: var(--paper);
  font-family: var(--display);
  font-size: 1.6rem;
  cursor: pointer;
  z-index: 10;
}
.lb-prev { left: 20px; }
.lb-next { right: 20px; }
.lb-nav:hover { background: var(--oxblood); }

@media (max-width: 900px) {
  .lb-inner { grid-template-columns: 1fr; }
  .lb-side { display: none; }
}
</style>
</head>
<body>

<section class="wrap gal-hero">
  <div class="reveal">
    <span class="eyebrow">Chapter II · The Gallery</span>
    <h1>Twelve paintings</h1>
    <p class="lede">Click any canvas to look closer, the lightbox lets you zoom in on a brush-stroke. All images are public domain, served direct from Wikimedia Commons.</p>
  </div>
</section>

<div class="ornament"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>

<section class="wrap">
  <div class="grid" id="grid"></div>
</section>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Painting viewer">
  <button class="lb-close" id="lbClose" aria-label="Close">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">←</button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">→</button>
  <div class="lb-inner">
    <div class="lb-img-wrap" id="lbImgWrap">
      <img class="lb-img" id="lbImg" alt="">
    </div>
    <div class="lb-side">
      <span class="eyebrow" id="lbYear"></span>
      <h3 id="lbTitle"></h3>
      <div class="meta-row" id="lbMeta"></div>
      <p id="lbBlurb"></p>
      <div class="hint">Click image to zoom in · ← → to browse · Esc to close</div>
    </div>
  </div>
</div>

<script src="data.js?v=21"></script>
<script>RRV_renderChrome();</script>
<script>
(function gallery() {
  const grid = document.getElementById('grid');
  const order = [
    {id: 'galaxy', size: 'l'},
    {id: 'self-portrait', size: 'm'},
    {id: 'shakuntala', size: 'l'},
    {id: 'damayanti', size: 'm'},
    {id: 'lakshmi', size: 's'},
    {id: 'saraswati', size: 's'},
    {id: 'milkmaid', size: 's'},
    {id: 'jatayu', size: 'l'},
    {id: 'krishna-yashoda', size: 'm'},
    {id: 'arjuna-subhadra', size: 'm'},
    {id: 'there-comes-papa', size: 'm'}
  ];
  const items = order.map(o => RRV_PAINTINGS.find(p => p.id === o.id) ? {...RRV_PAINTINGS.find(p=>p.id===o.id), size: o.size} : null).filter(Boolean);

  grid.innerHTML = items.map((p, i) => `
    <button class="tile reveal ${p.size}" data-i="${i}" aria-label="View ${p.title}">
      <div class="frame frame-thin"><img src="${p.src}" alt="${p.title}, ${p.year}" loading="lazy"></div>
      <div class="label">
        <span class="t">${p.title}</span>
        <span class="y">${p.year}</span>
      </div>
      <div class="blurb">${p.blurb}</div>
    </button>
  `).join('');

  // Re-bind reveal observer for newly-injected tiles
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  grid.querySelectorAll('.reveal').forEach(el => io.observe(el));

  // === Lightbox ===
  const lb = document.getElementById('lb');
  const lbImg = document.getElementById('lbImg');
  const lbWrap = document.getElementById('lbImgWrap');
  const lbTitle = document.getElementById('lbTitle');
  const lbYear = document.getElementById('lbYear');
  const lbMeta = document.getElementById('lbMeta');
  const lbBlurb = document.getElementById('lbBlurb');
  let cur = 0;

  function open(i) {
    cur = i;
    const p = items[i];
    lbImg.src = p.srcLarge || p.src;
    lbImg.alt = p.title;
    lbTitle.textContent = p.title;
    lbYear.textContent = p.year + ' · ' + p.medium;
    lbMeta.innerHTML = `<span>${p.medium}</span><span>${p.location}</span>`;
    lbBlurb.textContent = p.blurb;
    lbWrap.classList.remove('zoomed');
    lb.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function close() {
    lb.classList.remove('show');
    document.body.style.overflow = '';
  }
  function nav(d) {
    cur = (cur + d + items.length) % items.length;
    open(cur);
  }

  grid.addEventListener('click', e => {
    const t = e.target.closest('.tile');
    if (!t) return;
    open(parseInt(t.dataset.i, 10));
  });
  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', () => nav(-1));
  document.getElementById('lbNext').addEventListener('click', () => nav(1));
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  lbWrap.addEventListener('click', () => lbWrap.classList.toggle('zoomed'));
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('show')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') nav(-1);
    if (e.key === 'ArrowRight') nav(1);
  });
})();
</script>
<script src="shared.js?v=21"></script>
</body>
</html>
